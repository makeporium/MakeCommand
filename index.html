<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MakeCommand - Personal Command Center</title>

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MakeCommand" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>

  <body>
    <script>
      (function() {
        if (window.location.hash && window.location.hash.includes('access_token=')) {
          try {
            sessionStorage.setItem('supabase_auth_hash', window.location.hash);
            var params = new URLSearchParams(window.location.hash.substring(1));
            var providerToken = params.get('provider_token');
            if (providerToken) {
              sessionStorage.setItem('google_tasks_access_token', providerToken);
            }
          } catch (e) {}
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
